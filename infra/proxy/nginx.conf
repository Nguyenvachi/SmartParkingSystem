# TLS terminator + ACME challenge responder
# This proxy forwards all traffic to the existing `frontend` container.
# The frontend Nginx then proxies /api, /ws, /oauth2, /login/oauth2 to backend.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name smartparking.id.vn www.smartparking.id.vn;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name smartparking.id.vn www.smartparking.id.vn;

  ssl_certificate /etc/letsencrypt/live/smartparking.id.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/smartparking.id.vn/privkey.pem;

  # Modern TLS defaults
  ssl_session_timeout 10m;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  # Serve challenge on HTTPS too (not strictly required)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # WebSocket upgrade (needed for /ws)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
