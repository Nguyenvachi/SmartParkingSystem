services:
  proxy:
    image: nginx:1.27-alpine
    container_name: sp_proxy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  certbot:
    image: certbot/certbot:latest
    container_name: sp_certbot
    profiles: ["https"]
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: "/bin/sh -c"
    command: >
      "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"

  mailpit:
    image: axllent/mailpit:latest
    container_name: sp_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_WEB_PORT:-8025}:8025" # Web UI

  mysql:
    image: mysql:8.4
    container_name: sp_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smartparking_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - sp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: sp_backend
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started
      mysql:
        condition: service_healthy
    # env_file:
    #   - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartparking_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      # NOTE: We use MySQL root in this compose file.
      # Keep backend password consistent with the mysql container root password.
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      APP_WS_ALLOWED_ORIGIN_PATTERNS: ${APP_WS_ALLOWED_ORIGIN_PATTERNS:-*}
      APP_PASSWORD_RESET_EXPOSE_TOKEN: ${APP_PASSWORD_RESET_EXPOSE_TOKEN:-true}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:3000}
      APP_PAYMENT_BACKEND_BASE_URL: ${APP_PAYMENT_BACKEND_BASE_URL:-http://localhost:8080}

      # Payment gateways (optional)
      APP_PAYMENT_MOMO_ENABLED: ${APP_PAYMENT_MOMO_ENABLED:-false}
      APP_PAYMENT_MOMO_PARTNER_CODE: ${APP_PAYMENT_MOMO_PARTNER_CODE:-}
      APP_PAYMENT_MOMO_ACCESS_KEY: ${APP_PAYMENT_MOMO_ACCESS_KEY:-}
      APP_PAYMENT_MOMO_SECRET_KEY: ${APP_PAYMENT_MOMO_SECRET_KEY:-}
      APP_PAYMENT_MOMO_ALLOW_UNSAFE_RETURN_SUCCESS: ${APP_PAYMENT_MOMO_ALLOW_UNSAFE_RETURN_SUCCESS:-false}

      APP_PAYMENT_VNPAY_ENABLED: ${APP_PAYMENT_VNPAY_ENABLED:-false}
      APP_PAYMENT_VNPAY_TMN_CODE: ${APP_PAYMENT_VNPAY_TMN_CODE:-}
      APP_PAYMENT_VNPAY_HASH_SECRET: ${APP_PAYMENT_VNPAY_HASH_SECRET:-}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@smartparking.local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-SmartParkingNhom3JWTSecretKey2026ForHS256Algorithm}
      APP_QR_SECRET: ${APP_QR_SECRET:-SmartParkingQRHmacSecret2026Nhom3DigitalSignature}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: sp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sp_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  sp_mysql_data:
  letsencrypt:
  certbot_www:
