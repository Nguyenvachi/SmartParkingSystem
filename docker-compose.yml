services:
  mysql:
    image: mysql:8.4
    container_name: sp_mysql
    environment:
      MYSQL_DATABASE: smartparking_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - sp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: sp_backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartparking_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://172.24.195.164:3000
      APP_WS_ALLOWED_ORIGIN_PATTERNS: http://localhost:3000,http://172.24.195.164:3000
      APP_PASSWORD_RESET_EXPOSE_TOKEN: "true"
      APP_FRONTEND_BASE_URL: http://172.24.195.164:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: sp_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sp_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  sp_mysql_data:
