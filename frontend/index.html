<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
        <div class="text-center mb-4">
            <h1 class="display-4 fw-bold text-primary">Smart Parking System</h1>
            <p class="lead text-secondary">Hệ thống Giữ xe Thông minh - Nhóm 3</p>
        </div>

        <div class="d-flex gap-3">
            <button id="btnLogin" class="btn btn-primary btn-lg px-5 shadow-sm">Đăng Nhập</button>
            <button id="btnDashboard" class="btn btn-outline-dark btn-lg px-5 shadow-sm">Dashboard</button>
        </div>

        <footer class="mt-5 text-muted small">
            &copy; 2026 Smart Parking Team. J2EE Project.
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Navigation Logic -->
    <script>
        // Nút "Đăng Nhập"
        document.getElementById('btnLogin').addEventListener('click', function () {
            window.location.href = '/login';
        });

        // Nút "Dashboard" - Kiểm tra auth trước
        document.getElementById('btnDashboard').addEventListener('click', function () {
            let user = null;

            try {
                user = JSON.parse(localStorage.getItem('user') || 'null');
            } catch (e) {
                localStorage.removeItem('user');
            }

            if (user && user.token) {
                // Đã đăng nhập -> Vào dashboard
                window.location.href = '/dashboard';
            } else {
                localStorage.removeItem('user');
                // Chưa đăng nhập -> Hỏi có muốn đăng nhập không
                if (confirm('Bạn cần đăng nhập để truy cập Dashboard.\n\nChuyển đến trang đăng nhập?')) {
                    window.location.href = '/login';
                }
            }
        });
    </script>
</body>

</html>
