<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Smart Parking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page theme-minimal">

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top dashboard-navbar app-topbar">
        <div class="container-fluid dashboard-navbar-inner">
            <a class="navbar-brand dashboard-brand" href="index.html">
                <span class="brand-mark"><i class="bi bi-p-square-fill"></i></span>
                <span>
                    <strong>Smart Parking</strong>
                    <small>Đăng ký tài khoản</small>
                </span>
            </a>
        </div>
    </nav>

    <main class="auth-shell container py-4 py-lg-5 app-shell">
        <div class="auth-layout">
            <section class="auth-panel">
                <span class="eyebrow-pill"><i class="bi bi-person-plus"></i> Tạo tài khoản</span>
                <h1 class="h3">Bắt đầu với Smart Parking</h1>
                <p>Tạo tài khoản để đặt chỗ, dùng ví điện tử và theo dõi lịch sử giao dịch.</p>

                <div class="auth-badges">
                    <span class="badge rounded-pill"><i class="bi bi-person-badge me-1"></i>ROLE_USER</span>
                    <span class="badge rounded-pill"><i class="bi bi-shield-check me-1"></i>BCrypt</span>
                    <span class="badge rounded-pill"><i class="bi bi-clock-history me-1"></i>Lịch sử</span>
                </div>
            </section>

            <section class="app-surface">
                <div class="app-surface-header">
                    <div>
                        <div class="fw-bold">Thông tin đăng ký</div>
                        <div class="text-muted small">Nhập thông tin cơ bản để tạo tài khoản.</div>
                    </div>
                    <a href="index.html" class="btn btn-outline-secondary btn-sm">Trang chủ</a>
                </div>
                <div class="app-surface-body">
                    <div class="card auth-card border-0">
                        <div class="card-body p-0">
                            <form id="registerForm">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control auth-input" id="fullName" placeholder="Nguyễn Văn A" required>
                                    <label for="fullName">Họ và tên</label>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control auth-input" id="email" placeholder="name@example.com" required>
                                    <label for="email">Email</label>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control auth-input" id="password" placeholder="Password" required>
                                    <label for="password">Mật khẩu</label>
                                </div>

                                <button class="btn btn-brand w-100 py-3 rounded-3" type="submit">Đăng ký</button>
                            </form>

                            <div class="text-center mt-4">
                                <span class="text-muted">Đã có tài khoản?</span>
                                <a href="login.html" class="text-decoration-none fw-semibold">Đăng nhập</a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
