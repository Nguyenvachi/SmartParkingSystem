# Test profile: run Spring context without external MySQL dependency
spring.datasource.url=jdbc:h2:mem:smartparking;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Fixed non-production keys used only by the isolated H2 test profile
app.jwt.secret=test-only-jwt-signing-key-32-characters
app.qr.secret=test-only-qr-signing-key-32-characters

# Avoid background scheduled jobs during tests
spring.task.scheduling.enabled=false

# Keep test output readable
logging.level.root=ERROR
logging.level.com.parking.smartparking=ERROR
