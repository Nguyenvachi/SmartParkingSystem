spring.application.name=SmartParkingBackend
spring.config.import=optional:classpath:application-secrets.properties,optional:file:./application-secrets.properties

server.port=${SERVER_PORT:8080}

# Database credentials must be supplied through environment variables or a local
# application-secrets.properties file that is ignored by Git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartparking_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Google OAuth is optional. Use valid credentials only in a local environment.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.frontend.login-path=/login
app.frontend.dashboard-path=/dashboard

# Generate independent values with at least 32 bytes for local use.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000
app.qr.secret=${APP_QR_SECRET}

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.parking.smartparking.config.JwtAuthFilter=DEBUG

app.pricing.day-start-hour=6
app.pricing.night-start-hour=18
app.pricing.night-multiplier=1.5
app.pricing.long-stay-threshold-hours=12
app.pricing.long-stay-multiplier=1.25
app.wallet.minimum-topup=10000
app.membership.monthly-fee=300000
app.membership.auto-renew-interval-ms=300000

app.audit.recent-limit=100
app.ocr.default-confidence=0.91
app.voucher.seed-enabled=true

app.security.password-reset.expiry-minutes=15
app.security.password-reset.expose-token=${APP_PASSWORD_RESET_EXPOSE_TOKEN:false}

app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@smartparking.local}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}
app.ws.allowed-origin-patterns=${APP_WS_ALLOWED_ORIGIN_PATTERNS:*}
