spring.application.name=SmartParkingBackend
spring.config.import=optional:file:./application-secrets.properties,optional:file:./backend/application-secrets.properties

# Cấu hình Server
server.port=8080

# Cấu hình Database (Tạm thời để trống hoặc điền bừa để ko lỗi start)
spring.datasource.url=jdbc:mysql://localhost:3306/smartparking_db
spring.datasource.username=${DB_USERNAME:${db.username.local:root}}
spring.datasource.password=${DB_PASSWORD:${db.password.local:}}
spring.jpa.hibernate.ddl-auto=update

# --- GOOGLE OAUTH2 CONFIG ---  
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${google.client.id.local:your-google-client-id}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${google.client.secret.local:your-google-client-secret}}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend routing (npx serve uses clean URLs: /login, /dashboard)
app.frontend.base-url=http://localhost:3000
app.frontend.login-path=/login
app.frontend.dashboard-path=/dashboard

# ===== JWT Configuration (Tech Key #10: Middleware/Filter) =====
# Secret key MUST be >= 32 characters (256 bit) for HS256 algorithm
app.jwt.secret=${APP_JWT_SECRET:${jwt.secret.local:SmartParkingNhom3JWTSecretKey2026ForHS256Algorithm}}
# Token expiration: 86400000ms = 24 giờ
app.jwt.expiration=86400000

# ===== QR Code & Digital Signature (Tech Key #7) =====
# Secret key dùng cho HMAC-SHA256 ký số vé QR
app.qr.secret=${APP_QR_SECRET:${qr.secret.local:SmartParkingQRHmacSecret2026Nhom3DigitalSignature}}

# ===== Jackson: LocalDateTime -> ISO string (yyyy-MM-ddTHH:mm:ss) =====
# Không serialize thành array [2026,3,10,...], để JS new Date() parse được
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Debug Logging (tạm thời để chẩn đoán JWT filter) =====
logging.level.com.parking.smartparking.config.JwtAuthFilter=DEBUG

# ===== Phase 4: Dynamic Pricing / Wallet / Membership =====
app.pricing.day-start-hour=6
app.pricing.night-start-hour=18
app.pricing.night-multiplier=1.5
app.pricing.long-stay-threshold-hours=12
app.pricing.long-stay-multiplier=1.25
app.wallet.minimum-topup=10000
app.membership.monthly-fee=300000
app.membership.auto-renew-interval-ms=300000

# ===== Phase 5: Audit Log / OCR / Voucher =====
app.audit.recent-limit=100
app.ocr.default-confidence=0.91
app.voucher.seed-enabled=true

# ===== Password Reset (bắt buộc theo barem) =====
# NOTE: Dự án demo không cấu hình email service nên có thể bật expose token để test nhanh.
# Khi deploy thật, set env APP_PASSWORD_RESET_EXPOSE_TOKEN=false
app.security.password-reset.expiry-minutes=${APP_PASSWORD_RESET_EXPIRY_MINUTES:15}
app.security.password-reset.expose-token=${APP_PASSWORD_RESET_EXPOSE_TOKEN:true}

# ===== CORS / WebSocket Origins (Deploy-friendly) =====
# REST API origins (comma-separated). Override via env: APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}

# WebSocket allowed origin patterns for endpoint /ws (comma-separated).
# Defaults to '*' for dev; override via env: APP_WS_ALLOWED_ORIGIN_PATTERNS
app.ws.allowed-origin-patterns=${APP_WS_ALLOWED_ORIGIN_PATTERNS:*}
